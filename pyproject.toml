[project]
name = "spp2422-demo"
version = "0.1.0"
description = "Dashboard demo for SPP 2422 Teilprojekt 3: tool wear prediction from sheet metal forming force signals"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Felix Divo" },
    { name = "Antonia Wüst" },
    { name = "Jonas Moske" },
    { name = "Markus Schumann" },
]
dependencies = [
    "dash>=3.0.0",
    "dash-bootstrap-components>=2.0.0",
    "numpy>=2.1",
    "plotly>=6.0",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "torch>=2.6",
]

# Only needed where the app is served to more than one person: `spp2422-demo serve`
# runs Flask's development server, which is fine on a laptop and not fine on a host.
[project.optional-dependencies]
deploy = ["gunicorn>=23"]

[project.scripts]
spp2422-demo = "spp2422_demo.cli:main"

[dependency-groups]
dev = ["h5py>=3.12", "pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
